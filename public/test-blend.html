<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap');
  body { margin: 0; background: #000000; color: #fff; font-family: sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .wrapper { position: relative; width: 682px; height: 950px; background: #000000; }
  
  .halo {
    position: absolute;
    top: 10%;
    left: 4%;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    border: 2px solid rgba(220, 175, 95, 0.75);
    box-shadow: 0 0 60px rgba(212, 170, 92, 0.35), inset 0 0 50px rgba(212, 170, 92, 0.2);
    background: radial-gradient(circle at 50% 50%, rgba(212, 170, 92, 0.2) 0%, rgba(150, 100, 35, 0.06) 50%, transparent 70%);
  }

  .quote {
    position: absolute;
    top: 25%;
    right: 4%;
    z-index: 10;
    font-family: 'Caveat', cursive;
    font-size: 30px;
    line-height: 1.15;
    color: #e8dcc4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .quote-line {
    width: 44px;
    height: 2px;
    background: #d4aa5c;
    margin-top: 10px;
  }

  .photo {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: auto;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="halo"></div>
    <div class="quote">
      Better Ideas.<br>A Brighter Tomorrow.
      <div class="quote-line"></div>
    </div>
    <img src="/images/vishnuraj-original.jpg" class="photo" />
  </div>
</body>
</html>
